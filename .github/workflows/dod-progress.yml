name: Sprint-board

# Holder issuet "📋 Sprint-board" opdateret: hvem laver hvad i den aktuelle sprint,
# status pr. opgave (ikke startet / i gang / forsinket / færdig), DoD-fremskridt og backlog.

on:
  issues:
    types: [opened, closed, reopened, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: '30 6 * * 1-5'   # hverdage kl. 07:30 dansk tid (vintertid) – markerer forsinkede opgaver
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: sprint-board
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/sprint-board.js');
            await run({ github, context, core });
