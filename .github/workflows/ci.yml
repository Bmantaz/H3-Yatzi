name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend – build & test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore H3Yatzi.sln

      - name: Build
        run: dotnet build H3Yatzi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test H3Yatzi.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend – syntax & test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax
        run: node --check frontend/app.js

      - name: Test
        shell: bash
        # pipefail bevarer Node-testens fejlstatus, selv om tee skriver TAP-artifactet.
        run: |
          mkdir -p TestResults
          set -o pipefail
          node --test --test-reporter=tap tests/frontend/app.test.cjs | tee TestResults/frontend.tap

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: TestResults/frontend.tap

  arduino:
    name: Arduino – compile sketch (MKR WiFi 1010)
    # compile-sketches bruger Python 3.12.4, som findes til 24.04, men ikke 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:samd:mkrwifi1010
          sketch-paths: |
            - arduino/yatzi_controller
          libraries: |
            - name: Arduino_MKRIoTCarrier
            - name: WiFiNINA
