name: PR → issue-status

# Når en PR skriver "Closes #12", markeres issue #12 som 🟡 I gang på sprint-boardet.
# Lukkes PR'en uden merge, fjernes markeringen. Ved merge lukker GitHub selv issuet.

on:
  pull_request:
    types: [opened, edited, reopened, closed]

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/pr-status.js');
            await run({ github, context, core });

      - name: Opdatér sprint-board
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'dod-progress.yml', ref: context.payload.repository.default_branch,
            });
